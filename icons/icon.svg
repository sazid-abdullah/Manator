<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0015ff"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0015ff"/>
    </linearGradient>
    <linearGradient id="gradStemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0015ff"/>
    </linearGradient>
    <linearGradient id="gradStemLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256, 216)">
    <!-- Top-left roof -->
    <path d="M 0 -90 L -130 -90 L -170 -40 L -40 -40 Z" fill="url(#grad1)" opacity="0.8" />
    <!-- Top-right roof -->
    <path d="M 0 -90 L 130 -90 L 170 -40 L 40 -40 Z" fill="url(#grad2)" opacity="0.9" />

    <!-- Left front bar -->
    <path d="M -40 -40 L -170 -40 L -130 10 L 0 10 Z" fill="url(#grad3)" />
    <!-- Right front bar -->
    <path d="M 40 -40 L 170 -40 L 130 10 L 0 10 Z" fill="url(#grad2)" />

    <!-- Central kite connector -->
    <polygon points="0,-70 40,-40 0,10 -40,-40" fill="url(#grad1)" opacity="0.95" />
    <polygon points="0,-45 18,-30 0,-5 -18,-30" fill="#00f2fe" />

    <!-- Left stem -->
    <path d="M 0 10 L -40 10 L -90 150 L 0 150 Z" fill="url(#gradStemLeft)" />
    <!-- Right stem -->
    <path d="M 0 10 L 40 10 L 90 150 L 0 150 Z" fill="url(#gradStemRight)" />

    <!-- Bottom glowing accent base -->
    <polygon points="-90,150 90,150 60,170 -60,170" fill="#00f2fe" opacity="0.8" />

    <!-- Cyan neon accents -->
    <polyline points="-130,-90 -170,-40 -130,10" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.8" />
    <polyline points="130,-90 170,-40 130,10" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.8" />
    <line x1="-90" y1="150" x2="-60" y2="170" stroke="#00f2fe" stroke-width="3" opacity="0.8" />
    <line x1="90" y1="150" x2="60" y2="170" stroke="#00f2fe" stroke-width="3" opacity="0.8" />
    <!-- Stem middle dividing line -->
    <line x1="0" y1="10" x2="0" y2="150" stroke="#00f2fe" stroke-width="2" opacity="0.4" />
  </g>
</svg>